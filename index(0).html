<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bhavesh Kumawat // XDR-OS — Cybersecurity Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg-0:#05080a;
  --bg-1:#0a1015;
  --bg-2:#0e1620;
  --panel:#0c141c;
  --panel-2:#0e1a24;
  --line:#1b2833;
  --cyan:#5ee7d1;
  --cyan-dim:#2a7f74;
  --amber:#ffb454;
  --text-hi:#eaf2f2;
  --text-mid:#9fb3b8;
  --text-lo:#5c6e73;
  --danger:#ff6b6b;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  background:var(--bg-0);
  color:var(--text-hi);
  font-family:var(--sans);
  overflow:hidden;
  position:relative;
  -webkit-tap-highlight-color:transparent;
}

::selection{
  background:var(--cyan);
  color:#04120f;
}

a{
  color:var(--cyan);
}

/* ================= SCANLINES ================= */

#scan{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.014) 0px,
    rgba(255,255,255,0.014) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity:.5;
}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9998;
  box-shadow:inset 0 0 160px rgba(0,0,0,0.55);
}

/* ================= BOOT SCREEN ================= */

#boot{
  position:fixed;
  inset:0;
  background:#000;
  color:var(--cyan);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.7;
  padding:28px;
  z-index:10000;
  display:flex;
  flex-direction:column;
  white-space:pre-wrap;
}

#boot .cursor{
  display:inline-block;
  width:8px;
  height:14px;
  background:var(--cyan);
  vertical-align:middle;
  animation:blink 1s step-end infinite;
}

#boot-lines{
  flex:1;
  overflow:hidden;
}

#boot .ok{
  color:var(--cyan);
}

#boot .warn{
  color:var(--amber);
}

#boot .dim{
  color:var(--text-lo);
}

#boot.hide{
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

/* ================= DESKTOP ================= */

#desktop{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 12% 8%,rgba(94,231,209,0.06),transparent 42%),
    radial-gradient(circle at 88% 90%,rgba(255,180,84,0.05),transparent 42%),
    var(--bg-0);
  opacity:0;
  transition:opacity .6s ease;
}

#desktop.show{
  opacity:1;
}

#icons{
  position:absolute;
  top:22px;
  left:22px;
  display:flex
